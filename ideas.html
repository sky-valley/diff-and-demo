<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diff &amp; Demo — Ideas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geom:wght@300..900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* "Stuck?" prompt cards */
    .stuck {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 24px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .stuck .prompt {
      background: var(--ink);
      color: var(--bg);
      border-radius: 16px;
      padding: 22px;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .stuck .prompt em {
      font-style: normal;
      color: var(--accent);
    }

    /* Toolbar: search + surprise */
    .toolbar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar input {
      flex: 1 1 260px;
      font: inherit;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
    }
    .toolbar input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .toolbar button {
      font: inherit;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer;
    }
    .toolbar button:active { transform: scale(0.97); }

    /* Two-column layout: category nav + idea list */
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 96px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 40px;
      align-items: start;
    }
    .toc {
      position: sticky;
      top: 72px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toc a {
      color: var(--muted);
      text-decoration: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .toc a[hidden], .idea[hidden] { display: none; }
    .toc a:hover { color: var(--ink); background: var(--card); }
    .toc a.active { color: var(--ink); background: var(--card); font-weight: 600; }
    .toc a .count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }

    section.cat { scroll-margin-top: 72px; margin-bottom: 48px; }
    section.cat h2 {
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      margin: 0 0 16px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    section.cat h2 .count { font-size: 0.9rem; color: var(--muted); font-weight: 400; }

    .ideas {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .idea {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      line-height: 1.4;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .idea strong { display: block; margin-bottom: 4px; }
    .idea p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .idea mark { background: color-mix(in srgb, var(--accent) 45%, transparent); color: inherit; border-radius: 3px; }
    .idea.picked {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .no-results { color: var(--muted); padding: 24px 0; display: none; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; gap: 16px; }
      /* On small screens the category nav becomes a scrollable chip row */
      .toc {
        top: 49px;
        z-index: 5;
        flex-direction: row;
        overflow-x: auto;
        gap: 6px;
        margin: 0 -24px;
        padding: 10px 24px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        scrollbar-width: none;
      }
      .toc::-webkit-scrollbar { display: none; }
      .toc a { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; }
      .toc a .count { display: none; }
      section.cat { scroll-margin-top: 110px; }
    }
    @media (max-width: 600px) {
      .stuck, .toolbar, .layout { padding-left: 16px; padding-right: 16px; }
      .toc { margin: 0 -16px; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="inner">
      <a class="brand" href="index.html">Diff <span>&amp;</span> Demo</a>
      <a class="link" href="index.html">Inspiration</a>
      <a class="link" href="ideas.html" aria-current="page">Ideas</a>
      <a class="link" href="memes.html">Memes</a>
    </div>
  </nav>

  <header class="hero">
    <h1>Stuck?<br /><span>Start here.</span></h1>
    <p>Ideas for what to build at the meetup. Grab one as-is, mash two together, or use it as a starting point.</p>
  </header>

  <div class="stuck" id="stuck"></div>

  <div class="toolbar">
    <input id="search" type="search" autocomplete="off" placeholder="Search ideas… (quiz, map, game)" aria-label="Search ideas" />
    <button id="surprise" type="button">🎲 Surprise me</button>
  </div>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="Idea categories"></nav>
    <main id="list">
      <p class="no-results" id="no-results">Nothing matches. Try another word, or hit Surprise me.</p>
    </main>
  </div>

  <script>
    const STUCK = [
      ["a meme you love", "make it interactive"],
      ["something you complain about", "turn it into a game"],
      ["something only your friend group gets", "make it a quiz"],
      ["a boring form", "make it fun"],
      ["your job", "make a satire of it"],
      ["a feeling", "make a toy that feels like it"],
    ];

    const CATEGORIES = [
      ["Participation & collective", [
        '"Add yours": a prompt everyone answers into one shared page ("your most unhinged 3am purchase")',
        "Wall / guestbook: visitors leave a mark: a doodle, a sticker, a one-liner",
        "Chain / relay: each person continues the last person's story, drawing or song line",
        "Exquisite corpse: each visitor draws or writes one piece without seeing the whole",
        "Collective map: everyone pins a place and a memory",
        "Poll with a twist: the result reveals something funny about the voters",
        'Live tally: "how many people have cried on public transport this week"',
        "Confession booth: anonymous submissions, then a feed of them",
        "Time capsule: write something now, it unlocks on a date",
        "Leaderboard of something absurd: longest held eye contact with a cat photo",
        "Crowd-sourced dictionary: everyone defines a word only your group uses, the room votes on the best",
        "Shared canvas, one pixel each: every visitor gets exactly one pixel, forever",
      ]],
      ["Personalised", [
        "A meme but personalised: your photo or name dropped into a known format",
        '"Which X are you" quiz: with a result card worth screenshotting',
        "Generator: your band name, rapper name, cottagecore name, villain origin story",
        'Horoscope / fortune: for something niche ("your sourdough\'s horoscope")',
        "Receipt: your year, your relationship or your personality printed as a shop receipt",
        'Certificate / award: "Officially Certified Overthinker"',
        "Wrapped-style recap: stats about something non-streaming (your friendship, your week)",
        "Trading card: turn yourself or your pet into a collectible with stats",
        "Fake magazine cover or movie poster starring you",
        "Tarot for a subculture: tech bros, theatre kids, plant parents",
        "Personality chart: plot yourself on a two-axis meme grid",
        "Your life as a patch notes changelog: v28.0, fixed a bug where you replied \"you too\" to the waiter",
        "Your search history as a museum exhibit: with placards and an audio guide",
      ]],
      ["Satire & commentary", [
        "Satire of a product category: an app that honestly admits what it's optimising for",
        "Fake app store listing / landing page for an absurd startup",
        "Parody terms and conditions you have to scroll and accept",
        'Corporate speak translator: "per my last email" → what it really means',
        'Honest ad: move a slider from "marketing" to "truth"',
        "Fake notification simulator: your phone, but every app guilt-trips you",
        "Dystopian onboarding flow: sign up for a service that asks increasingly invasive questions",
        "Absurd calculator: how many lattes until you can afford a house in your city",
        'The "vs" comparison: selfie vs a £50k ad campaign',
        "Startup pivot generator: spin until your app becomes Uber for something",
        "Pricing page for a friendship: Free, Pro and Enterprise tiers of being there for someone",
        "LinkedIn post inflator: turn \"I made toast\" into a 12-paragraph leadership lesson",
      ]],
      ["Games", [
        "Mini game: one mechanic, 30 seconds, done",
        "Reflex game: tap when the thing happens",
        "Guess the price / guess the number: of a thing, a rent, a stat",
        "Higher or lower",
        "Spot the difference / spot the fake: real headline or made up? AI or human?",
        "Guess who / guess where: from a photo, a playlist or a screenshot",
        "Pixel art arcade parody: a street fighter game about a boring office battle",
        "Choose-your-own-adventure: a text story with branching decisions",
        "Idle / clicker game: about something relatable (clicker for replying to emails)",
        "Endless runner / dodger: dodge responsibilities, dodge exes",
        "Daily puzzle: a Wordle-style game for your niche",
        "Trivia about a specific world: your fandom, your city, your friend group",
        "Simulation with a moral: run a city, a band, a café and see where it goes",
        "Two-player pass-the-phone",
        "Bluff game: write a fake answer, everyone guesses which one is real",
        "Speedrun a chore: a timed game version of loading the dishwasher",
      ]],
      ["Toys & play", [
        "Boop / poke / pet: tap the thing, it reacts",
        "Dress-up / builder: assemble an outfit, a sandwich, a monster",
        "Sound toy: tap to make a beat, a choir of cats",
        'Slider that changes everything: drag from "normal" to "unhinged"',
        "Fidget / satisfying interaction: pop, peel, squish, sort",
        "Scratch card reveal",
        "Destruction toy: smash, spray-paint, vandalise (a poster, your to-do list)",
        'Magic 8-ball for a specific decision: "should I text them?"',
        "Oracle / wheel of fate: spin to choose dinner, your day's quest",
        "Pet / tamagotchi: keep something alive for a day",
        "Gravity playground: drop the words of a sentence and watch them pile up",
        "Zen garden: rake the sand, place the rocks, nothing else",
      ], "No win state"],
      ["Creative tools", [
        'Card maker: birthday, apology, breakup, "sorry I missed your call"',
        "Bouquet / gift builder: send someone a digital thing with a note",
        "Poster / zine generator in a specific aesthetic",
        "Collage maker from preset stickers",
        "Playlist cover generator",
        "Lyric-free song mood picker: builds a vibe card from choices",
        "Stencil / stamp maker",
        "Tiny comic generator: three panels, pick the characters and lines",
        "Mood board from prompts",
        "Font from your handwriting: draw a few letters, type with them",
        "Album cover remix: recreate a famous cover with shapes and stickers",
      ], "Tiny ones"],
      ["Social & relationships", [
        "Friendship test: make a quiz about yourself and send it to friends",
        '"How well do you know me": with a scoreboard',
        "Compatibility checker: for friends, flatmates, travel buddies",
        "Icebreaker deck: for dates, dinners, team offsites",
        "Would you rather: and see how others answered",
        "Hot takes ranking: drag to rank, compare with others",
        "Group decision maker: where to eat, what to watch",
        "Secret Santa / gift draw",
        "Group chat awards: upload a chat, get \"most likely to leave you on read\"",
        "Excuse generator for leaving the party, ranked by believability",
      ]],
      ["Useful but with personality", [
        "Countdown: to a holiday, a release, a birthday, with a vibe",
        "Tracker with a character: a plant that wilts if you don't drink water",
        "Tiny calculator for a niche problem: split the bill including who had wine",
        "Checklist with a payoff: pack for a festival, a moving-house list",
        'Recipe with a twist: "cook what\'s in your fridge"',
        "Local guide / map: your 5 favourite spots, with notes",
        "Explainer toy: an interactive version of a concept you love explaining",
        "Fridge-to-meal planner: pick three ingredients, get a dinner with a confidence score",
        "Commute companion: something to do for exactly the length of your journey",
      ]],
      ["Storytelling & media", [
        "Interactive essay / scrollytelling",
        "Photo meme that reveals a hidden layer on tap",
        "Fake chat / group chat drama: a story told through messages",
        "Fake phone: go through someone's apps, texts, notes to discover a story",
        "Found footage / fake archive: a museum of a fictional thing",
        "Podcast/newsletter turned into an interactive: a quiz or game from an episode",
        "Radio / playlist from a place or era",
        "Fake news broadcast about your life",
        "Letter you have to open",
        "Choose-the-ending documentary: a real event told from three points of view",
        "A day in the life of an object: your phone charger narrates its week",
      ]],
      ["Phone sensors & hardware", [
        "Tilt game: roll a marble through a maze by tilting your phone",
        "Shake to decide: shake your phone for an answer, harder shakes for bigger decisions",
        "Clap / shout meter: the louder the room, the more the thing grows",
        "Camera filter with a story: point at your desk and it narrates what it sees",
        "Pass-the-phone hot potato: it buzzes and explodes at a random moment",
        "Walk-to-unlock: a story that only reveals the next line after 100 steps",
      ], "Use the phone in your hand"],
      ["Absurd / internet-native", [
        "Button that does nothing: but counts how many people pressed it",
        "Useless machine: the more you try, the more it resists",
        "Worst possible UI: a form designed to be infuriating",
        "Rate my X: a landing page, a fit, a desk setup, with a rating card",
        'Absurd subscription: "Premium Sloth"',
        "Simulator of a tiny moment: waiting for the kettle, a Zoom call freezing",
        "Emotional support object: a rock that says nice things",
        "Screenshot bait: something whose whole point is the image people share",
        "Loading bar for something that never finishes: your inbox, your personal growth",
        "Captcha but philosophical: select all squares containing joy",
      ]],
    ];

    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const slug = (s) => s.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    // Stuck prompts
    document.getElementById("stuck").innerHTML = STUCK
      .map(([thing, action]) => `<div class="prompt">Take ${esc(thing)} and <em>${esc(action)}</em></div>`)
      .join("");

    // Categories + ideas
    const toc = document.getElementById("toc");
    const list = document.getElementById("list");
    const noResults = document.getElementById("no-results");

    const sections = CATEGORIES.map(([name, items, note]) => {
      const id = slug(name);
      const link = document.createElement("a");
      link.href = "#" + id;
      link.innerHTML = `${esc(name)} <span class="count">${items.length}</span>`;
      toc.appendChild(link);

      const section = document.createElement("section");
      section.className = "cat";
      section.id = id;
      section.innerHTML = `<h2>${esc(name)}${note ? ` <span class="count">${esc(note)}</span>` : ""}</h2><ul class="ideas"></ul>`;
      const ul = section.querySelector("ul");

      const ideas = items.map((raw) => {
        const i = raw.indexOf(": ");
        const title = i === -1 ? raw : raw.slice(0, i);
        const desc = i === -1 ? "" : raw.slice(i + 2);
        const li = document.createElement("li");
        li.className = "idea";
        ul.appendChild(li);
        return { li, title, desc, text: (name + " " + raw).toLowerCase() };
      });

      list.insertBefore(section, noResults);
      return { section, link, ideas };
    });

    function highlight(str, q) {
      if (!q) return esc(str);
      const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      return esc(str).replace(re, "<mark>$1</mark>");
    }

    function render(q = "") {
      q = q.trim().toLowerCase();
      let total = 0;
      sections.forEach(({ section, link, ideas }) => {
        let shown = 0;
        ideas.forEach((idea) => {
          const match = !q || idea.text.includes(q);
          idea.li.hidden = !match;
          if (match) {
            shown++;
            idea.li.innerHTML = `<strong>${highlight(idea.title, q)}</strong>${idea.desc ? `<p>${highlight(idea.desc, q)}</p>` : ""}`;
          }
        });
        section.hidden = shown === 0;
        link.hidden = shown === 0;
        link.querySelector(".count").textContent = shown;
        total += shown;
      });
      noResults.style.display = total ? "none" : "block";
    }
    render();

    const search = document.getElementById("search");
    search.addEventListener("input", () => render(search.value));
    // Browsers can restore a typed search on back/forward; keep the list in sync
    window.addEventListener("pageshow", () => render(search.value));

    // Sections are built by JS, so jump to a #category link once they exist
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();

    // Surprise me: clear the search, jump to a random idea and highlight it
    document.getElementById("surprise").addEventListener("click", () => {
      if (search.value) { search.value = ""; render(); }
      const all = sections.flatMap((s) => s.ideas);
      const pick = all[Math.floor(Math.random() * all.length)];
      document.querySelectorAll(".idea.picked").forEach((el) => el.classList.remove("picked"));
      pick.li.classList.add("picked");
      pick.li.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    // Highlight the category currently in view
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        sections.forEach(({ section, link }) => {
          const on = section === e.target;
          link.classList.toggle("active", on);
          if (on && getComputedStyle(toc).flexDirection === "row") {
            toc.scrollTo({ left: link.offsetLeft - 24, behavior: "smooth" });
          }
        });
      });
    }, { rootMargin: "-120px 0px -60% 0px" });
    sections.forEach(({ section }) => observer.observe(section));
  </script>
</body>
</html>
